name: Generate Blog Post

on:
  schedule:
    - cron: '0 9 * * 2'  # Tuesday 9am UTC
    - cron: '0 9 * * 4'  # Thursday 9am UTC
    - cron: '0 9 * * 6'  # Saturday 9am UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test content quality gate
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Publish due research editorial
        id: scheduled
        run: python scripts/publish_scheduled_post.py --git-push

      - name: Generate post
        if: steps.scheduled.outputs.published != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_FEED_API_KEY: ${{ secrets.BLOG_FEED_API_KEY }}
        run: python scripts/generate_post.py
